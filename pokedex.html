<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex - Specimen Index</title>
  <style>
    :root {
      --bg-primary: #060913;
      --shell-border: #dc2626;
      --screen-bg: #090d16;
      --panel-bg: #0d1322;
      --card-bg: #131b2e;
      --accent-green: #22c55e;
      --accent-blue: #38bdf8;
      --active-blue: #0ea5e9;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      
      /* Type Colors */
      --type-electric: #f59e0b;
      --type-grass: #10b981;
      --type-poison: #a855f7;
      --type-fire: #ef4444;
      --type-water: #3b82f6;
      --type-bug: #84cc16;
      --type-normal: #64748b;
      --type-flying: #06b6d4;
      --type-ground: #d97706;
      --type-rock: #b45309;
      --type-fairy: #ec4899;
      --type-psychic: #f43f5e;
      --type-fighting: #c2410c;
      --type-ice: #0284c7;
      --type-dragon: #6366f1;
      --type-ghost: #7e22ce;
      --type-steel: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Hide Scrollbars */
    *::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    body {
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .pokedex-shell {
      background: #000;
      border: 8px solid var(--shell-border);
      border-radius: 28px;
      padding: 20px;
      width: 100%;
      max-width: 960px;
      box-shadow: 0 20px 50px rgba(220, 38, 38, 0.25);
    }

    .pokedex-inner {
      background: var(--screen-bg);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* HEADER UI */
    .pokedex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .main-orb {
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 35% 35%, #7dd3fc, #0284c7);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #0284c7;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    /* SEARCH & SCOPE HEADER ROW */
    .header-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .control-box {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .box-label {
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .search-wrapper {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }

    .scan-btn {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 0 16px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .scope-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-top: 6px;
    }

    /* MAIN CONTENT GRID */
    .main-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* TELEMETRY / LEFT PANEL */
    .telemetry-header {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .visual-screen {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      border-radius: 10px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .pokemon-sprite {
      width: 140px;
      height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
    }

    .specimen-no {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 0.65rem;
      color: var(--text-muted);
      background: rgba(0,0,0,0.4);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .identity-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pokemon-name {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: capitalize;
    }

    .meta-row {
      display: flex;
      gap: 6px;
    }

    .type-badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #000;
      letter-spacing: 0.5px;
    }

    .specs-line {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: rgba(0,0,0,0.2);
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      gap: 12px;
    }

    .specs-line span {
      color: #cbd5e1;
    }

    /* STATS BARS GRID */
    .stats-matrix {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-bar-bg {
      background: rgba(255, 255, 255, 0.05);
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
    }

    .stat-bar-fill {
      background: var(--active-blue);
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* EVOLUTION BAR */
    .evolution-box {
      margin-top: 4px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 8px;
    }

    .evo-chain {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .evo-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .evo-img {
      width: 32px;
      height: 32px;
    }

    .evo-label {
      font-size: 0.55rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* DIRECTORY / RIGHT PANEL */
    .directory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .directory-title {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .directory-meta {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .list-scroller {
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 330px;
      overflow-y: auto;
    }

    .pokemon-row {
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pokemon-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .pokemon-row.active {
      background: var(--active-blue);
      color: #fff;
    }

    .pokemon-row.active .row-id {
      color: rgba(255, 255, 255, 0.8);
    }

    .row-thumb {
      width: 24px;
      height: 24px;
    }

    .row-name {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
      flex: 1;
    }

    .row-id {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .system-status {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .pagination-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn:hover:not(:disabled) {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* MOBILE PRESERVATION (NO CHANGE TO PHONE INTERFACE) */
    .accordion-summary { display: none; }

    @media (max-width: 840px) {
      body { padding: 8px; }
      .pokedex-shell { border-width: 4px; padding: 12px; border-radius: 18px; }
      .pokedex-inner { padding: 12px; gap: 12px; }
      .header-controls { grid-template-columns: 1fr; }
      .main-grid { grid-template-columns: 1fr; }
      
      .accordion-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .accordion-summary::-webkit-details-marker { display: none; }
      
      .directory-accordion[open] .accordion-icon { transform: rotate(180deg); }
      .accordion-icon { transition: transform 0.2s; font-size: 0.75rem; color: var(--text-muted); }
    }
  </style>
</head>
<body>

  <div class="pokedex-shell">
    <div class="pokedex-inner">
      
      <header class="pokedex-header">
        <div class="brand-group">
          <div class="main-orb"></div>
          <div>
            <div class="brand-title">Pokédex</div>
            <div class="brand-subtitle">Professional Specimen Index</div>
          </div>
        </div>
        <div class="status-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
      </header>

      <div class="header-controls">
        <div class="control-box">
          <span class="box-label">Query Database</span>
          <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter name or ID (1-1025)..." />
            <button id="searchBtn" class="scan-btn">SCAN</button>
          </div>
        </div>
        <div class="control-box">
          <span class="box-label">Registry Scope</span>
          <div class="scope-text">Generations I–IX (IDs 1–1025)</div>
        </div>
      </div>

      <div class="main-grid">
        
        <!-- SPECIMEN TELEMETRY -->
        <section class="panel">
          <span class="telemetry-header">Specimen Telemetry</span>
          
          <div class="visual-screen">
            <img id="pokemonSprite" class="pokemon-sprite" src="" alt="Pokemon" />
            <span id="specimenNo" class="specimen-no">No. ---</span>
          </div>

          <div class="identity-row">
            <div id="pokemonName" class="pokemon-name">---</div>
            <div id="pokemonTypes" class="meta-row"></div>
          </div>

          <div class="specs-line">
            Height: <span id="pokemonHeight">0.0 m</span> | 
            Weight: <span id="pokemonWeight">0.0 kg</span> | 
            Base EXP: <span id="pokemonExp">0</span>
          </div>

          <div class="stats-matrix">
            <div class="stat-row">
              <div class="stat-meta"><span>HP</span><span id="statHp">0</span></div>
              <div class="stat-bar-bg"><div id="barHp" class="stat-bar-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-meta"><span>ATK</span><span id="statAtk">0</span></div>
              <div class="stat-bar-bg"><div id="barAtk" class="stat-bar-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-meta"><span>DEF</span><span id="statDef">0</span></div>
              <div class="stat-bar-bg"><div id="barDef" class="stat-bar-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-meta"><span>SATK</span><span id="statSAtk">0</span></div>
              <div class="stat-bar-bg"><div id="barSAtk" class="stat-bar-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-meta"><span>SDEF</span><span id="statSDef">0</span></div>
              <div class="stat-bar-bg"><div id="barSDef" class="stat-bar-fill"></div></div>
            </div>
            <div class="stat-row">
              <div class="stat-meta"><span>SPD</span><span id="statSpd">0</span></div>
              <div class="stat-bar-bg"><div id="barSpd" class="stat-bar-fill"></div></div>
            </div>
          </div>

          <div class="evolution-box">
            <div class="telemetry-header" style="margin-bottom: 6px;">Evolution Chain</div>
            <div id="evolutionChain" class="evo-chain"></div>
          </div>
        </section>

        <!-- DIRECTORY INDEX -->
        <details id="directoryAccordion" class="panel directory-accordion" open>
          <summary class="accordion-summary">
            <span class="directory-title">Directory Index</span>
            <span class="accordion-icon">&#9660;</span>
          </summary>
          
          <div class="directory-header">
            <span class="directory-title">Directory Index</span>
            <span id="countLabel" class="directory-meta">1-10 of 1025</span>
          </div>

          <div id="pokemonList" class="list-scroller"></div>
        </details>

      </div>

      <footer class="bottom-bar">
        <span class="system-status">System Ready.</span>
        <div class="pagination-group">
          <button id="prevBtn" class="nav-btn" disabled>&larr; Prev</button>
          <span id="pageIndicator" class="page-indicator">Page 1 of 103</span>
          <button id="nextBtn" class="nav-btn">Next &rarr;</button>
        </div>
      </footer>

    </div>
  </div>

  <script>
    const STATE = {
      currentPage: 1,
      itemsPerPage: 10,
      totalItems: 1025,
      activeId: 25
    };

    const TYPE_COLORS = {
      electric: 'var(--type-electric)',
      grass: 'var(--type-grass)',
      poison: 'var(--type-poison)',
      fire: 'var(--type-fire)',
      water: 'var(--type-water)',
      bug: 'var(--type-bug)',
      normal: 'var(--type-normal)',
      flying: 'var(--type-flying)',
      ground: 'var(--type-ground)',
      rock: 'var(--type-rock)',
      fairy: 'var(--type-fairy)',
      psychic: 'var(--type-psychic)',
      fighting: 'var(--type-fighting)',
      ice: 'var(--type-ice)',
      dragon: 'var(--type-dragon)',
      ghost: 'var(--type-ghost)',
      steel: 'var(--type-steel)'
    };

    const DOM = {
      pokemonList: document.getElementById('pokemonList'),
      pokemonSprite: document.getElementById('pokemonSprite'),
      specimenNo: document.getElementById('specimenNo'),
      pokemonName: document.getElementById('pokemonName'),
      pokemonTypes: document.getElementById('pokemonTypes'),
      pokemonHeight: document.getElementById('pokemonHeight'),
      pokemonWeight: document.getElementById('pokemonWeight'),
      pokemonExp: document.getElementById('pokemonExp'),
      evolutionChain: document.getElementById('evolutionChain'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pageIndicator: document.getElementById('pageIndicator'),
      countLabel: document.getElementById('countLabel'),
      searchInput: document.getElementById('searchInput'),
      searchBtn: document.getElementById('searchBtn'),
      stats: {
        hp: document.getElementById('statHp'),
        atk: document.getElementById('statAtk'),
        def: document.getElementById('statDef'),
        satk: document.getElementById('statSAtk'),
        sdef: document.getElementById('statSDef'),
        spd: document.getElementById('statSpd')
      },
      bars: {
        hp: document.getElementById('barHp'),
        atk: document.getElementById('barAtk'),
        def: document.getElementById('barDef'),
        satk: document.getElementById('barSAtk'),
        sdef: document.getElementById('barSDef'),
        spd: document.getElementById('barSpd')
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadPage(STATE.currentPage);
      inspectPokemon(STATE.activeId);
      setupEventListeners();
    });

    async function loadPage(page) {
      STATE.currentPage = page;
      DOM.pokemonList.innerHTML = '';
      const offset = (page - 1) * STATE.itemsPerPage;

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${STATE.itemsPerPage}&offset=${offset}`);
        const data = await response.json();

        data.results.forEach((item, index) => {
          const id = offset + index + 1;
          const row = document.createElement('div');
          row.className = `pokemon-row ${id === STATE.activeId ? 'active' : ''}`;
          row.innerHTML = `
            <img class="row-thumb" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" alt="${item.name}" />
            <span class="row-name">${item.name}</span>
            <span class="row-id">#${String(id).padStart(3, '0')}</span>
          `;
          row.addEventListener('click', () => {
            STATE.activeId = id;
            document.querySelectorAll('.pokemon-row').forEach(r => r.classList.remove('active'));
            row.classList.add('active');
            inspectPokemon(id);
          });
          DOM.pokemonList.appendChild(row);
        });

        updatePaginationUI();
      } catch (err) {
        DOM.pokemonList.innerHTML = '<div style="font-size:0.7rem; padding:8px;">Failed to load registry</div>';
      }
    }

    async function inspectPokemon(query) {
      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${String(query).toLowerCase().trim()}`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();

        STATE.activeId = data.id;

        DOM.pokemonSprite.src = data.sprites.other['official-artwork'].front_default || data.sprites.front_default || '';
        DOM.specimenNo.textContent = `No. ${String(data.id).padStart(3, '0')}`;
        DOM.pokemonName.textContent = data.name;
        DOM.pokemonHeight.textContent = `${(data.height / 10).toFixed(1)} m`;
        DOM.pokemonWeight.textContent = `${(data.weight / 10).toFixed(1)} kg`;
        DOM.pokemonExp.textContent = data.base_experience || '---';

        DOM.pokemonTypes.innerHTML = data.types
          .map(t => {
            const color = TYPE_COLORS[t.type.name] || 'var(--type-normal)';
            return `<span class="type-badge" style="background:${color}">${t.type.name}</span>`;
          })
          .join('');

        const statMap = { hp: 0, attack: 0, defense: 0, 'special-attack': 0, 'special-defense': 0, speed: 0 };
        data.stats.forEach(s => statMap[s.stat.name] = s.base_stat);

        DOM.stats.hp.textContent = statMap.hp;
        DOM.stats.atk.textContent = statMap.attack;
        DOM.stats.def.textContent = statMap.defense;
        DOM.stats.satk.textContent = statMap['special-attack'];
        DOM.stats.sdef.textContent = statMap['special-defense'];
        DOM.stats.spd.textContent = statMap.speed;

        DOM.bars.hp.style.width = `${Math.min(100, (statMap.hp / 180) * 100)}%`;
        DOM.bars.atk.style.width = `${Math.min(100, (statMap.attack / 180) * 100)}%`;
        DOM.bars.def.style.width = `${Math.min(100, (statMap.defense / 180) * 100)}%`;
        DOM.bars.satk.style.width = `${Math.min(100, (statMap['special-attack'] / 180) * 100)}%`;
        DOM.bars.sdef.style.width = `${Math.min(100, (statMap['special-defense'] / 180) * 100)}%`;
        DOM.bars.spd.style.width = `${Math.min(100, (statMap.speed / 180) * 100)}%`;

        fetchEvolutionChain(data.species.url);
      } catch (err) {
        alert('Specimen not found in database.');
      }
    }

    async function fetchEvolutionChain(speciesUrl) {
      DOM.evolutionChain.innerHTML = '<span style="font-size:0.6rem; color:var(--text-muted)">Loading chain...</span>';
      try {
        const speciesRes = await fetch(speciesUrl);
        const speciesData = await speciesRes.json();
        
        const evoRes = await fetch(speciesData.evolution_chain.url);
        const evoData = await evoRes.json();

        const chain = [];
        let curr = evoData.chain;

        while (curr) {
          const id = curr.species.url.split('/').filter(Boolean).pop();
          chain.push({ name: curr.species.name, id: id });
          curr = curr.evolves_to[0];
        }

        DOM.evolutionChain.innerHTML = chain.map(node => `
          <div class="evo-item" onclick="inspectPokemon(${node.id})">
            <img class="evo-img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${node.id}.png" alt="${node.name}" />
            <span class="evo-label">${node.name}</span>
          </div>
        `).join('');

      } catch (err) {
        DOM.evolutionChain.innerHTML = '<span style="font-size:0.6rem; color:var(--text-muted)">No chain data</span>';
      }
    }

    function handleSearch() {
      const q = DOM.searchInput.value;
      if (q) {
        inspectPokemon(q);
        DOM.searchInput.value = '';
      }
    }

    function updatePaginationUI() {
      const totalPages = Math.ceil(STATE.totalItems / STATE.itemsPerPage);
      const start = (STATE.currentPage - 1) * STATE.itemsPerPage + 1;
      const end = Math.min(STATE.currentPage * STATE.itemsPerPage, STATE.totalItems);

      DOM.pageIndicator.textContent = `Page ${STATE.currentPage} of ${totalPages}`;
      DOM.countLabel.textContent = `${start}-${end} of ${STATE.totalItems}`;
      DOM.prevBtn.disabled = STATE.currentPage === 1;
      DOM.nextBtn.disabled = STATE.currentPage === totalPages;
    }

    function setupEventListeners() {
      DOM.prevBtn.addEventListener('click', () => {
        if (STATE.currentPage > 1) loadPage(STATE.currentPage - 1);
      });

      DOM.nextBtn.addEventListener('click', () => {
        const totalPages = Math.ceil(STATE.totalItems / STATE.itemsPerPage);
        if (STATE.currentPage < totalPages) loadPage(STATE.currentPage + 1);
      });

      DOM.searchBtn.addEventListener('click', handleSearch);
      DOM.searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
      });
    }
  </script>
</body>
</html>
